services:
  mongodb:
    image: mongo:7
    container_name: procuraos-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - procuraos-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  procuraos-mongodb-data:
